[package]
name = "bulle-desktop"
version = "0.0.0"
description = "Bulle desktop app: a Tauri shell around the web client"
license = "MIT"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "bulle-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
