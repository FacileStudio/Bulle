[tools]
bun = "1.4.4"

[env]
BUN_BIN = { value = "{{tools.bun.path}}/bin/bun", tools = true }

[tasks.install]
description = "Install frontend dependencies"
sources = ["package.json", "bun.lock"]
run = '"$BUN_BIN" install --frozen-lockfile'

[tasks.build]
description = "Build the frontend"
depends = [":install"]
run = '"$BUN_BIN" run build'

[tasks.check]
description = "Run the frontend checks"
depends = [":install"]
run = '"$BUN_BIN" run check'

[tasks.dev]
description = "Start the frontend dev server"
depends = [":install"]
run = '"$BUN_BIN" run dev'

[tasks.preview]
description = "Preview the production frontend build"
depends = [":build"]
run = '"$BUN_BIN" run preview'

[tasks."mobile:sync"]
description = "Build the web app and sync it into the Android project"
depends = [":install"]
run = '"$BUN_BIN" run build && "$BUN_BIN" --bun x cap sync android'

[tasks."mobile:apk"]
description = "Build the release APK"
depends = ["mobile:sync"]
run = 'cd android && ./gradlew assembleRelease'
