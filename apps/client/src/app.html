<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="color-scheme" content="light dark" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Bulle" />
		<meta property="og:url" content="https://bulle.facile.studio/" />
		<meta property="og:title" content="Bulle" />
		<meta
			property="og:description"
			content="Bulle is a coding agent with its own computer, in your browser."
		/>
		<script>
			try {
				var theme = localStorage.getItem('bulle-theme');
				var root = document.documentElement;
				root.classList.toggle('dark', theme === 'dark');
				root.classList.toggle('light', theme === 'light');
			} catch (e) {}
		</script>
		%sveltekit.head%
		<title>Bulle</title>
		<meta
			name="description"
			content="Bulle is a coding agent with its own computer, in your browser."
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
