<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bulle · The assistant that takes care of the rest</title>
		<meta name="description" content="Bulle reads your mail, finds a slot in your calendar and files your tasks across the Facile apps. It asks before it acts. AI comes with the Pro or Studio plan." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://bulle.facile.studio/" />
		<meta property="og:title" content="Bulle · The assistant that takes care of the rest" />
		<meta property="og:description" content="Bulle reads your mail, finds a slot in your calendar and files your tasks across the Facile apps. It asks before it acts. AI comes with the Pro or Studio plan." />
		<meta property="og:image" content="https://bulle.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Bulle: The assistant that takes care of the rest" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Bulle · The assistant that takes care of the rest" />
		<meta name="twitter:description" content="Bulle reads your mail, finds a slot in your calendar and files your tasks across the Facile apps. It asks before it acts. AI comes with the Pro or Studio plan." />
		<meta name="twitter:image" content="https://bulle.facile.studio/og-image.png" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var theme = localStorage.getItem('bulle-theme');
				var root = document.documentElement;
				root.classList.toggle('dark', theme === 'dark');
				root.classList.toggle('light', theme === 'light');
			} catch (e) {}
		</script>
		<script>
			(function () {
				if (location.hostname !== 'bulle.facile.studio') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
