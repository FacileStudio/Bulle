# One container, one hostname: bulle.facile.studio.
#
#   bulle.facile.studio        -> the Go binary, which serves both halves
#   bulle.facile.studio/api/*  -> the API routes, mounted under router.Route("/api", ...)
#   everything else            -> the built SvelteKit SPA, served by tronc/spa
#
# No PathPrefix and no stripprefix: the /api prefix must reach the binary intact,
# or every route 404s. The service is exposed, never published; only Traefik
# reaches it over dokploy-network. Compose labels replace what Dokploy injects,
# so they take full ownership of this service's routing.
#
# Every variable the binary reads is forwarded by name below. A value set only
# in the panel and absent here never reaches the container. Values come from
# casier (project bulle, environment prod).
#
# The image stays distroless :nonroot because it writes nothing. The only mount
# is the directory holding the boite worker's Unix socket. The directory is
# mounted, not the socket file, because the worker recreates the socket on every
# restart and a file bind mount would keep pointing at the deleted inode. The
# worker chowns the socket to BOITE_WORKER_SOCK_GROUP with mode 0660, and group_add
# gives uid 65532 that group so connect() succeeds. Defaults to GID 1000 and /var/tmp/boite.
# See docs/deploy.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bulle}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  bulle:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    group_add:
      - "${BOITE_SOCK_GID:-1000}"
    volumes:
      - ${BOITE_SOCK_DIR:-/var/tmp/boite}:/run/boite
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.bulle-web.rule: "Host(`bulle.facile.studio`)"
      traefik.http.routers.bulle-web.entrypoints: web
      traefik.http.routers.bulle-web.middlewares: redirect-to-https@file
      traefik.http.routers.bulle-web.service: bulle-svc
      traefik.http.routers.bulle-secure.rule: "Host(`bulle.facile.studio`)"
      traefik.http.routers.bulle-secure.entrypoints: websecure
      traefik.http.routers.bulle-secure.tls.certresolver: letsencrypt
      traefik.http.routers.bulle-secure.service: bulle-svc
      traefik.http.services.bulle-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bulle}?sslmode=disable
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://bulle.facile.studio,https://localhost,tauri://localhost,http://tauri.localhost}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      PUSH_TOPIC_SECRET: ${PUSH_TOPIC_SECRET:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private,cloudflare}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sso.facile.studio}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bulle}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PORTE_TOKEN_KEY: ${PORTE_TOKEN_KEY:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-https://bulle.facile.studio/api/auth/oidc/callback}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-https://bulle.facile.studio/}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-facile-cli}
      OIDC_MACHINE_AUDIENCE: ${OIDC_MACHINE_AUDIENCE:-bulle}
      OIDC_SCOPE_PREFIX: ${OIDC_SCOPE_PREFIX:-bulle}
      OIDC_MOBILE_REDIRECT: ${OIDC_MOBILE_REDIRECT:-studio.facile.bulle://auth}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BULLE_CREDENTIALS_KEY: ${BULLE_CREDENTIALS_KEY:-}
      BULLE_IDLE_MINUTES: ${BULLE_IDLE_MINUTES:-}
      BULLE_HARDWARE_GATEWAY_URL: ${BULLE_HARDWARE_GATEWAY_URL:-}
      BULLE_BROWSER: ${BULLE_BROWSER:-}
      BULLE_LLM_BACKEND: ${BULLE_LLM_BACKEND:-}
      BULLE_LLM_MODEL: ${BULLE_LLM_MODEL:-}
      BULLE_LLM_MODELS: ${BULLE_LLM_MODELS:-}
      PRISME_URL: ${PRISME_URL:-https://prisme.facile.studio}
      PRISME_SERVICE_KEY: ${PRISME_SERVICE_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      BULLE_AI_CALLERS: ${BULLE_AI_CALLERS:-}
      TZ: ${TZ:-Europe/Paris}
      BOITE_WORKER_SOCK: ${BOITE_WORKER_SOCK:-/run/boite/worker.sock}
      BOITE_WORKER_TOKEN: ${BOITE_WORKER_TOKEN:-}
      # The private key the API logs into its boxes with. It is read as
      # BULLE_BOX_KEY, with the older BOITE_CONTROL_KEY name as a fallback, so a
      # deployment holding only the old secret still starts with a key. A value
      # set in neither place is generated at boot, and this API's public half is
      # pushed to each box on its next run.
      BULLE_BOX_KEY: ${BULLE_BOX_KEY:-${BOITE_CONTROL_KEY:-}}
      ANTENNE_INSTANCE: ${ANTENNE_INSTANCE:-}
      ANTENNE_APP: ${ANTENNE_APP:-bulle}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
      ANTENNE_INSTANCE_ID: ${ANTENNE_INSTANCE_ID:-}
      SUITE_COURRIER_MCP_URL: ${SUITE_COURRIER_MCP_URL:-}
      SUITE_COURRIER_MCP_RESOURCE: ${SUITE_COURRIER_MCP_RESOURCE:-}
      SUITE_AGENDA_MCP_URL: ${SUITE_AGENDA_MCP_URL:-}
      SUITE_AGENDA_MCP_RESOURCE: ${SUITE_AGENDA_MCP_RESOURCE:-}
      SUITE_SONAR_MCP_URL: ${SUITE_SONAR_MCP_URL:-}
      SUITE_SONAR_MCP_RESOURCE: ${SUITE_SONAR_MCP_RESOURCE:-}
      SUITE_NUAGE_MCP_URL: ${SUITE_NUAGE_MCP_URL:-}
      SUITE_NUAGE_MCP_RESOURCE: ${SUITE_NUAGE_MCP_RESOURCE:-}
      SUITE_OPUS_MCP_URL: ${SUITE_OPUS_MCP_URL:-}
      SUITE_OPUS_MCP_RESOURCE: ${SUITE_OPUS_MCP_RESOURCE:-}
      SUITE_SABLIER_MCP_URL: ${SUITE_SABLIER_MCP_URL:-}
      SUITE_SABLIER_MCP_RESOURCE: ${SUITE_SABLIER_MCP_RESOURCE:-}
      SUITE_GLOUTON_MCP_URL: ${SUITE_GLOUTON_MCP_URL:-}
      SUITE_GLOUTON_MCP_RESOURCE: ${SUITE_GLOUTON_MCP_RESOURCE:-}
      SUITE_MYCELIUM_MCP_URL: ${SUITE_MYCELIUM_MCP_URL:-}
      SUITE_MYCELIUM_MCP_RESOURCE: ${SUITE_MYCELIUM_MCP_RESOURCE:-}
      SUITE_PLUME_MCP_URL: ${SUITE_PLUME_MCP_URL:-}
      SUITE_PLUME_MCP_RESOURCE: ${SUITE_PLUME_MCP_RESOURCE:-}
      SUITE_CAPSULE_MCP_URL: ${SUITE_CAPSULE_MCP_URL:-}
      SUITE_CAPSULE_MCP_RESOURCE: ${SUITE_CAPSULE_MCP_RESOURCE:-}
      SUITE_JOURNAL_MCP_URL: ${SUITE_JOURNAL_MCP_URL:-}
      SUITE_JOURNAL_MCP_RESOURCE: ${SUITE_JOURNAL_MCP_RESOURCE:-}
      SUITE_ANTENNE_MCP_URL: ${SUITE_ANTENNE_MCP_URL:-}
      SUITE_ANTENNE_MCP_RESOURCE: ${SUITE_ANTENNE_MCP_RESOURCE:-}
      SUITE_VISION_MCP_URL: ${SUITE_VISION_MCP_URL:-}
      SUITE_VISION_MCP_RESOURCE: ${SUITE_VISION_MCP_RESOURCE:-}
      SUITE_ECHO_MCP_URL: ${SUITE_ECHO_MCP_URL:-}
      SUITE_ECHO_MCP_RESOURCE: ${SUITE_ECHO_MCP_RESOURCE:-}
      SUITE_TOILE_MCP_URL: ${SUITE_TOILE_MCP_URL:-}
      SUITE_TOILE_MCP_RESOURCE: ${SUITE_TOILE_MCP_RESOURCE:-}
      SUITE_DOCS_MCP_URL: ${SUITE_DOCS_MCP_URL:-}
      SUITE_DOCS_MCP_RESOURCE: ${SUITE_DOCS_MCP_RESOURCE:-}
      SUITE_FEUILLES_MCP_URL: ${SUITE_FEUILLES_MCP_URL:-}
      SUITE_FEUILLES_MCP_RESOURCE: ${SUITE_FEUILLES_MCP_RESOURCE:-}
      BULLE_SABLIER_TIME_TRACKING: ${BULLE_SABLIER_TIME_TRACKING:-true}
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      db:
        condition: service_healthy

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: bulle_db_data
